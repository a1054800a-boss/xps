name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (verbose)
        run: ./gradlew clean build assembleRelease assembleDebug -v --stacktrace

      - name: List build outputs
        run: |
          find app/build -name "*.apk" -type f
          ls -la app/build/outputs/ || echo "No outputs directory"

      - name: Upload APKs to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: app/build/outputs/apk/**/
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
