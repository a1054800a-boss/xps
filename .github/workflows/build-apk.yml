name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check project structure
        run: |
          echo "=== Directory Structure ==="
          ls -la
          echo ""
          echo "=== App Directory ==="
          ls -la app/
          echo ""
          echo "=== Gradle Version ==="
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug -v 2>&1 | tee build_debug.log

      - name: Build Release APK
        run: ./gradlew assembleRelease -v 2>&1 | tee build_release.log

      - name: Check build outputs
        run: |
          echo "=== Looking for APKs ==="
          find . -name "*.apk" -type f
          echo ""
          echo "=== App Build Directory ==="
          ls -la app/build/ || echo "No build directory"
          echo ""
          echo "=== Full outputs directory ==="
          find app/build/outputs -type f 2>/dev/null | head -20 || echo "No outputs found"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_debug.log
            build_release.log

      - name: Upload APKs (if found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
